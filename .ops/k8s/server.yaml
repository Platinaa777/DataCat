apiVersion: apps/v1
kind: Deployment
metadata:
  name: datacat-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: datacat-server
  template:
    metadata:
      labels:
        app: datacat-server
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: datacat-server:local
          args: ["-migrate"]
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 4317
          envFrom:
            - configMapRef:
                name: datacat
            - secretRef:
                name: datacat
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: datacat-server
spec:
  selector:
    app: datacat-server
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 4317
      targetPort: grpc
