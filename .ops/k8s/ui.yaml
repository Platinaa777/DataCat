apiVersion: apps/v1
kind: Deployment
metadata:
  name: datacat-ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: datacat-ui
  template:
    metadata:
      labels:
        app: datacat-ui
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui
          image: datacat-ui:local
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: datacat-ui
spec:
  selector:
    app: datacat-ui
  ports:
    - name: http
      port: 8080
      targetPort: http
