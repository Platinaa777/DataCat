apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: datacat
spec:
  ingressClassName: nginx
  tls:
    - hosts: [datacat.example.com]
      secretName: datacat-tls
  rules:
    - host: datacat.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: datacat-ui
                port:
                  name: http
