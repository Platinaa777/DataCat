services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: datacat
      POSTGRES_DB: datacat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init-env.sh first}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U datacat -d datacat"]
      interval: 5s
      timeout: 3s
      retries: 20
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: [start-dev, --import-realm]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run scripts/init-env.sh first}
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./.ops/keycloak:/opt/keycloak/data/import:ro
    mem_limit: 768m
volumes:
  postgres-data:
