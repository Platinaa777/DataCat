name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: datacat-test-only
          POSTGRES_DB: datacat_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:datacat-test-only@localhost:5432/datacat_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21.13"
          cache: true
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race -tags integration ./...
      - run: go build ./cmd/...
      - run: docker build -f .ops/docker/server.Dockerfile -t datacat-server:test .
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: frontend/datacat-ui/package-lock.json
      - run: npm ci
        working-directory: frontend/datacat-ui
      - run: npm run lint && npm run typecheck && npm run build
        working-directory: frontend/datacat-ui
      - run: docker build -f .ops/docker/ui.Dockerfile -t datacat-ui:test .
